# Azure DevOps Pipeline for API Testing
# Siemens Energy Project

trigger:
  branches:
    include:
      - main
      - develop
      - feature/*
  paths:
    exclude:
      - README.md
      - docs/*

pr:
  branches:
    include:
      - main
      - develop

schedules:
  - cron: "0 2 * * *"  # Run at 2 AM daily
    displayName: Nightly Regression Tests
    branches:
      include:
        - main
    always: true

variables:
  - group: api-test-variables  # Variable group in Azure DevOps
  - name: python.version
    value: '3.9'
  - name: pytest.markers
    value: ''  # Can be set to run specific markers

stages:
  - stage: Build
    displayName: 'Build and Setup'
    jobs:
      - job: Setup
        displayName: 'Setup Environment'
        pool:
          vmImage: 'ubuntu-latest'
        
        steps:
          - task: UsePythonVersion@0
            displayName: 'Use Python $(python.version)'
            inputs:
              versionSpec: '$(python.version)'
          
          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install -r requirements-test.txt
            displayName: 'Install Dependencies'
          
          - script: |
              pip install flake8 black
              flake8 app/ tests/ --max-line-length=120 --exclude=__pycache__
            displayName: 'Code Linting'
            continueOnError: true
          
          - task: PublishPipelineArtifact@1
            displayName: 'Publish Python Environment'
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)'
              artifact: 'app-source'
              publishLocation: 'pipeline'

  - stage: Test
    displayName: 'Run Tests'
    dependsOn: Build
    jobs:
      - job: UnitTests
        displayName: 'Unit and Integration Tests'
        pool:
          vmImage: 'ubuntu-latest'
        
        services:
          postgres:
            image: postgres:latest
            env:
              POSTGRES_PASSWORD: password123
              POSTGRES_DB: fastapi_test
            ports:
              - 5432:5432
        
        steps:
          - task: UsePythonVersion@0
            displayName: 'Use Python $(python.version)'
            inputs:
              versionSpec: '$(python.version)'
          
          - task: DownloadPipelineArtifact@2
            displayName: 'Download Source'
            inputs:
              artifact: 'app-source'
              path: $(System.DefaultWorkingDirectory)
          
          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install -r requirements-test.txt
            displayName: 'Install Dependencies'
          
          - script: |
              # Wait for PostgreSQL to be ready
              sleep 10
            displayName: 'Wait for Database'
          
          - script: |
              export DATABASE_HOSTNAME=localhost
              export DATABASE_PORT=5432
              export DATABASE_PASSWORD=password123
              export DATABASE_NAME=fastapi
              export DATABASE_USERNAME=postgres
              export SECRET_KEY=$(SECRET_KEY)
              export ALGORITHM=HS256
              export ACCESS_TOKEN_EXPIRE_MINUTES=30
              
              # Run manual tests
              pytest tests/ \
                --junitxml=junit/test-results.xml \
                --cov=app \
                --cov-report=xml \
                --cov-report=html \
                -v \
                -n auto
            displayName: 'Run Manual Tests'
            env:
              DATABASE_HOSTNAME: localhost
              DATABASE_PORT: 5432
              DATABASE_PASSWORD: password123
              DATABASE_NAME: fastapi
              DATABASE_USERNAME: postgres
          
          - script: |
              export DATABASE_HOSTNAME=localhost
              export DATABASE_PORT=5432
              export DATABASE_PASSWORD=password123
              export DATABASE_NAME=fastapi
              export DATABASE_USERNAME=postgres
              export SECRET_KEY=$(SECRET_KEY)
              export ALGORITHM=HS256
              export ACCESS_TOKEN_EXPIRE_MINUTES=30
              
              # Run generated tests
              pytest generator/generated-tests/ \
                --junitxml=junit/generated-test-results.xml \
                -v \
                -n auto
            displayName: 'Run Generated Tests'
            continueOnError: true
          
          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-*.xml'
              searchFolder: '$(System.DefaultWorkingDirectory)'
              mergeTestResults: true
              failTaskOnFailedTests: true
              testRunTitle: 'API Tests - $(Build.SourceBranchName)'
          
          - task: PublishCodeCoverageResults@1
            displayName: 'Publish Code Coverage'
            condition: succeededOrFailed()
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
              reportDirectory: '$(System.DefaultWorkingDirectory)/htmlcov'
          
          - task: PublishPipelineArtifact@1
            displayName: 'Publish HTML Report'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/htmlcov'
              artifact: 'coverage-report'
              publishLocation: 'pipeline'

      - job: GenerateTestsValidation
        displayName: 'Validate Test Generation'
        pool:
          vmImage: 'ubuntu-latest'
        
        steps:
          - task: UsePythonVersion@0
            displayName: 'Use Python $(python.version)'
            inputs:
              versionSpec: '$(python.version)'
          
          - task: DownloadPipelineArtifact@2
            displayName: 'Download Source'
            inputs:
              artifact: 'app-source'
              path: $(System.DefaultWorkingDirectory)
          
          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install -r requirements-test.txt
            displayName: 'Install Dependencies'
          
          - script: |
              # Validate OpenAPI spec
              python -c "import json; json.load(open('generator/test.json'))"
            displayName: 'Validate OpenAPI Spec'
          
          - script: |
              # Check if generated tests are up to date
              python generator/pytest_api_test_generator.py
              git diff --exit-code generator/generated-tests/ || echo "Generated tests may need update"
            displayName: 'Check Generated Tests'
            continueOnError: true

  - stage: Report
    displayName: 'Generate Reports'
    dependsOn: Test
    condition: succeededOrFailed()
    jobs:
      - job: AllureReport
        displayName: 'Generate Allure Report'
        pool:
          vmImage: 'ubuntu-latest'
        
        steps:
          - script: |
              echo "Allure report generation - requires allure installation"
              # allure generate allure-results --clean -o allure-report
            displayName: 'Generate Allure Report'
            continueOnError: true

  - stage: Deploy
    displayName: 'Deploy to Environments'
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployDev
        displayName: 'Deploy to DEV'
        environment: 'DEV'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Deploy to DEV environment"
                  displayName: 'Deploy Application'

      - job: SmokeTests
        displayName: 'Run Smoke Tests'
        dependsOn: DeployDev
        pool:
          vmImage: 'ubuntu-latest'
        
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(python.version)'
          
          - script: |
              pip install -r requirements-test.txt
              pytest tests/ -m smoke --base-url=$(DEV_BASE_URL)
            displayName: 'Run Smoke Tests'
            continueOnError: true

[pytest]
# Pytest Configuration for Siemens Energy API Testing

# Test Discovery
testpaths = tests generator/generated-tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    smoke: Quick smoke tests for critical functionality
    regression: Full regression test suite
    integration: Integration tests requiring external services
    unit: Unit tests for isolated functionality
    slow: Tests that take longer than 1 second
    auth: Authentication and authorization tests
    crud: CRUD operation tests
    negative: Negative test cases (error handling)
    skip_in_ci: Tests to skip in CI environment
    generated: Auto-generated tests from OpenAPI spec
    manual: Manually written tests

# Test Execution Options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    # Coverage options (uncomment for coverage reporting)
    # --cov=app
    # --cov-report=html
    # --cov-report=term-missing
    # --cov-fail-under=70
    
    # HTML Report
    # --html=reports/pytest-report.html
    # --self-contained-html
    
    # JUnit XML for CI/CD
    # --junitxml=reports/junit.xml
    
    # JSON Report
    # --json-report
    # --json-report-file=reports/report.json

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout
timeout = 300
timeout_method = thread

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Test Collection
norecursedirs = .git .tox dist build *.egg venv .venv __pycache__ .pytest_cache

# Minimum Python version
minversion = 3.9

# Console output width
console_output_style = progress

# Show summary of all test outcomes
# -ra shows all except passed
# -rA shows all
# -rN shows none
# -rx shows xfailed
# -rX shows xpassed
# -rf shows failed
# -rE shows error
# -rs shows skipped
# -rp shows passed
# -rP shows passed with output
# -rw shows warnings
junit_family = xunit2

# Parallel execution with pytest-xdist
# Uncomment to enable by default
# [pytest] addopts includes:
# -n auto  # Use all available CPU cores
# --dist loadscope  # Group tests by module/class

# Coverage configuration
[coverage:run]
source = app
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */alembic/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov
